<!-- LIVE ENERGINET API SCRIPT (OPDATERET TIL NYESTE API) -->
    <script>
        let currentZone = 'DK1';
        let includeTaxes = true;
        let selectedEvKwh = 44; 
        let todaysPrices = []; 
        let bestWindowIndices = [];

        // Estimeret elafgift + transporttarif inkl. moms (ca. 1.15 kr/kWh)
        const ESTIMATED_TAX_AND_TARIFF = 1.15;

        async function fetchLivePrices() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            // Beregn morgendagens dato til API-afgrænsning
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tYear = tomorrow.getFullYear();
            const tMonth = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const tDay = String(tomorrow.getDate()).padStart(2, '0');
            const tomorrowStr = `${tYear}-${tMonth}-${tDay}`;

            document.getElementById('date-badge').innerText = `${day}/${month}/${year}`;

            // Energinet DataHub API (DayAheadPrices)
            const filter = encodeURIComponent(JSON.stringify({ PriceArea: [currentZone] }));
            const url = `https://api.energidataservice.dk/dataset/DayAheadPrices?start=${todayStr}T00:00&end=${tomorrowStr}T00:00&filter=${filter}&sort=TimeDK%20ASC`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP fejl: ${response.status}`);
                const data = await response.json();

                if (!data.records || data.records.length === 0) {
                    throw new Error("Ingen prisdata fundet for i dag");
                }

                // Grupper kvarters- eller timepriser i hele timer (0-23)
                const hourlyBuckets = {};
                data.records.forEach(record => {
                    const timeField = record.TimeDK || record.HourDK;
                    const priceField = record.DayAheadPriceDKK !== undefined ? record.DayAheadPriceDKK : record.SpotPriceDKK;
                    
                    if (timeField && priceField !== null && priceField !== undefined) {
                        const hourInt = parseInt(timeField.substring(11, 13), 10);
                        if (!hourlyBuckets[hourInt]) hourlyBuckets[hourInt] = [];
                        hourlyBuckets[hourInt].push(priceField);
                    }
                });

                todaysPrices = Object.keys(hourlyBuckets)
                    .map(h => parseInt(h, 10))
                    .sort((a, b) => a - b)
                    .map(hourInt => {
                        const prices = hourlyBuckets[hourInt];
                        const avgMwhPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
                        const spotWithVat = (avgMwhPrice / 1000) * 1.25;
                        const finalPrice = includeTaxes ? (spotWithVat + ESTIMATED_TAX_AND_TARIFF) : spotWithVat;

                        return {
                            hour: hourInt,
                            hourStr: String(hourInt).padStart(2, '0'),
                            price: Math.max(0, finalPrice)
                        };
                    });

                updateDashboard();

            } catch (error) {
                console.error("Fejl ved hentning af elpriser:", error);
                document.getElementById('current-hour-label').innerText = "Forbindelsesfejl";
                document.getElementById('current-status-text').innerText = "Kunne ikke hente live priser fra Energinet lige nu.";
            }
        }

        function updateDashboard() {
            if (todaysPrices.length === 0) return;

            const currentHour = new Date().getHours();
            const currentObj = todaysPrices.find(p => p.hour === currentHour) || todaysPrices[0];
            const pricesOnly = todaysPrices.map(p => p.price);

            const minPrice = Math.min(...pricesOnly);
            const maxPrice = Math.max(...pricesOnly);
            const avgPrice = pricesOnly.reduce((a, b) => a + b, 0) / pricesOnly.length;

            const curVal = currentObj.price;
            document.getElementById('current-price-val').innerText = curVal.toFixed(2);
            document.getElementById('current-hour-label').innerText = `Live pris kl. ${currentObj.hourStr}:00 - ${String((currentHour + 1) % 24).padStart(2, '0')}:00`;

            const heroPanel = document.getElementById('hero-panel');
            const statusText = document.getElementById('current-status-text');
            const liveBadge = document.getElementById('live-badge');
            const livePing = document.getElementById('live-ping');

            const lowThreshold = minPrice + (maxPrice - minPrice) * 0.35;
            const highThreshold = minPrice + (maxPrice - minPrice) * 0.70;

            if (curVal <= lowThreshold) {
                heroPanel.className = "glass-panel rounded-3xl p-6 sm:p-8 glow-emerald relative overflow-hidden transition-all duration-500";
                liveBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold tracking-wide uppercase";
                livePing.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
                statusText.className = "text-base font-semibold text-emerald-400 flex items-center gap-2";
                statusText.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Grønt lys: Strømmen er billig lige nu.`;
            } else if (curVal <= highThreshold) {
                heroPanel.className = "glass-panel rounded-3xl p-6 sm:p-8 glow-amber relative overflow-hidden transition-all duration-500";
                liveBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold tracking-wide uppercase";
                livePing.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping";
                statusText.className = "text-base font-semibold text-amber-400 flex items-center gap-2";
                statusText.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Middel pris: Fint til almindeligt forbrug, men vent med elbilen.`;
            } else {
                heroPanel.className = "glass-panel rounded-3xl p-6 sm:p-8 glow-rose relative overflow-hidden transition-all duration-500";
                liveBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold tracking-wide uppercase";
                livePing.className = "w-2 h-2 rounded-full bg-rose-400 animate-ping";
                statusText.className = "text-base font-semibold text-rose-400 flex items-center gap-2";
                statusText.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg> Dyr spidsbelastning: Udskyd elbil, vask og opvask.`;
            }

            document.getElementById('stat-min').innerText = `${minPrice.toFixed(2)} kr`;
            document.getElementById('stat-avg').innerText = `${avgPrice.toFixed(2)} kr`;
            document.getElementById('stat-max').innerText = `${maxPrice.toFixed(2)} kr`;

            calculateBestEvWindow();
            updateHomeAssistant(lowThreshold, maxPrice);
            renderBlockChart(currentHour, lowThreshold, highThreshold, maxPrice);
        }

        function calculateBestEvWindow() {
            const hoursNeeded = Math.round(selectedEvKwh / 11);
            if (todaysPrices.length < hoursNeeded) return;

            let minSum = Infinity;
            let bestStartIdx = 0;

            for (let i = 0; i <= todaysPrices.length - hoursNeeded; i++) {
                let sum = 0;
                for (let j = 0; j < hoursNeeded; j++) {
                    sum += todaysPrices[i + j].price;
                }
                if (sum < minSum) {
                    minSum = sum;
                    bestStartIdx = i;
                }
            }

            bestWindowIndices = [];
            for (let j = 0; j < hoursNeeded; j++) {
                bestWindowIndices.push(bestStartIdx + j);
            }

            const startHourStr = todaysPrices[bestStartIdx].hourStr;
            const endHourNum = (todaysPrices[bestStartIdx + hoursNeeded - 1].hour + 1) % 24;
            const endHourStr = String(endHourNum).padStart(2, '0');

            const avgWindowPrice = minSum / hoursNeeded;
            const totalCost = avgWindowPrice * selectedEvKwh;

            document.getElementById('ev-window-label').innerText = `Billigste ${hoursNeeded}-timers ladevindue i dag`;
            document.getElementById('ev-best-time').innerText = `Kl. ${startHourStr}:00 – ${endHourStr}:00`;
            document.getElementById('ev-cost-details').innerHTML = `Estimeret pris for ${selectedEvKwh} kWh: <span class="font-bold text-white">${totalCost.toFixed(2)} DKK</span> (gns. ${avgWindowPrice.toFixed(2)} kr/kWh)`;
        }

        function updateHomeAssistant(lowThreshold, maxPrice) {
            if (todaysPrices.length < 2) return;
            let min2h = Infinity;
            let best2hIdx = 0;
            for (let i = 0; i < todaysPrices.length - 1; i++) {
                const sum = todaysPrices[i].price + todaysPrices[i+1].price;
                if (sum < min2h) {
                    min2h = sum;
                    best2hIdx = i;
                }
            }
            const start2h = todaysPrices[best2hIdx].hourStr;
            const end2h = String((todaysPrices[best2hIdx + 1].hour + 1) % 24).padStart(2, '0');
            document.getElementById('home-best-2h').innerText = `Bedste tid: Kl. ${start2h}:00 - ${end2h}:00`;
            document.getElementById('home-best-price').innerText = `${(min2h / 2).toFixed(2)} kr/kWh`;

            const currentHour = new Date().getHours();
            const upcomingGood = todaysPrices.find(p => p.hour >= currentHour && p.price <= lowThreshold);
            if (upcomingGood) {
                document.getElementById('home-next-good').innerText = upcomingGood.hour === currentHour 
                    ? `Lige nu (kl. ${upcomingGood.hourStr}:00)` 
                    : `Starter kl. ${upcomingGood.hourStr}:00`;
                document.getElementById('home-next-price').innerText = `${upcomingGood.price.toFixed(2)} kr/kWh`;
            } else {
                document.getElementById('home-next-good').innerText = `Ingen flere billige timer i dag`;
                document.getElementById('home-next-price').innerText = `Vent til i nat`;
            }

            const worstObj = todaysPrices.reduce((prev, curr) => (curr.price > prev.price) ? curr : prev, todaysPrices[0]);
            const worstEnd = String((worstObj.hour + 1) % 24).padStart(2, '0');
            document.getElementById('home-worst-time').innerText = `Spidsbelastning: Kl. ${worstObj.hourStr}:00 - ${worstEnd}:00`;
            document.getElementById('home-worst-price').innerText = `${worstObj.price.toFixed(2)} kr/kWh`;
        }

        function renderBlockChart(currentHour, lowThreshold, highThreshold, maxPrice) {
            const container = document.getElementById('block-chart');
            const chartCeiling = Math.max(maxPrice * 1.1, 1.5);

            container.innerHTML = todaysPrices.map((item, idx) => {
                const heightPercent = Math.max((item.price / chartCeiling) * 100, 8);
                let colorClass = "bg-emerald-500 hover:bg-emerald-400";
                
                if (item.price > highThreshold) {
                    colorClass = "bg-rose-500 hover:bg-rose-400";
                } else if (item.price > lowThreshold) {
                    colorClass = "bg-amber-500 hover:bg-amber-400";
                }

                const isCurrent = item.hour === currentHour;
                const isEvWindow = bestWindowIndices.includes(idx);

                let borderStyle = "";
                if (isCurrent) {
                    borderStyle = "ring-2 ring-white z-10";
                } else if (isEvWindow) {
                    borderStyle = "border-t-4 border-emerald-200 shadow-lg shadow-emerald-500/30";
                }

                return `
                    <div class="flex-1 flex flex-col items-center h-full justify-end group relative">
                        <div class="absolute -top-9 hidden group-hover:flex flex-col items-center bg-slate-900 border border-slate-700 text-white text-[10px] py-1 px-2 rounded-lg font-bold whitespace-nowrap z-30 shadow-xl">
                            <span>Kl. ${item.hourStr}:00</span>
                            <span class="text-emerald-400">${item.price.toFixed(2)} kr/kWh</span>
                        </div>
                        <div class="w-full rounded-t-sm transition-all duration-300 ${colorClass} ${borderStyle}" style="height: ${heightPercent}%;"></div>
                    </div>
                `;
            }).join('');
        }

        function setEvKwh(kwh, btn) {
            selectedEvKwh = kwh;
            document.querySelectorAll('.ev-btn').forEach(b => {
                b.className = "ev-btn p-2.5 rounded-xl bg-slate-800 border border-slate-700 font-semibold text-white transition";
            });
            btn.className = "ev-btn active p-2.5 rounded-xl bg-emerald-500/20 border border-emerald-500 font-semibold text-emerald-400 transition";
            updateDashboard();
        }

        function setZone(zone) {
            currentZone = zone;
            const btn1 = document.getElementById('btn-dk1');
            const btn2 = document.getElementById('btn-dk2');
            if (zone === 'DK1') {
                btn1.className = "px-2.5 sm:px-3 py-1.5 rounded-lg bg-slate-800 text-emerald-400 border border-slate-700 transition";
                btn2.className = "px-2.5 sm:px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
            } else {
                btn2.className = "px-2.5 sm:px-3 py-1.5 rounded-lg bg-slate-800 text-emerald-400 border border-slate-700 transition";
                btn1.className = "px-2.5 sm:px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
            }
            fetchLivePrices();
        }

        function toggleTax() {
            includeTaxes = !includeTaxes;
            const dot = document.getElementById('tax-dot');
            const label = document.getElementById('tax-label');
            const subText = document.getElementById('sub-tax-text');

            if (includeTaxes) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                label.innerText = "Inkl. afgifter & moms";
                subText.innerText = "inkl. moms & est. afgift";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-slate-500";
                label.innerText = "Kun rå spotpris + moms";
                subText.innerText = "ekskl. elafgift & tarif";
            }
            fetchLivePrices();
        }

        fetchLivePrices();
    </script>
</body>
</html>
